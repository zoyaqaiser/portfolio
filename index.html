skills:()=>`<h2>Skills</h2><p class="cm">// what I work with, grouped by area</p><div class="sg">${SK.map((k,i)=>`<div class="sc"><header><h3>${k[0]}</h3><span class="lv ${k[1]==="Learning"?"l":k[1]==="Working"?"w":""}">${k[1]}</span></header><div class="chips">${k[2].map(c=>`<span>${c}</span>`).join("")}</div></div>`).join("")}</div>`,

<div class="it now"><small>OCT 2026 — PRESENT · Remote</small><h3>AI Automation Intern</h3><div class="pk">@ DevelopersHub Corporation</div><ul><li>Learning to build with APIs and agentic AI workflows</li><li>${td("one thing you built or shipped")}</li></ul></div>
<div class="it"><small>SEP 2026 · Remote</small><h3>AI/ML Intern</h3><div class="pk">@ InAmigos Foundation</div><ul><li>Trained and evaluated ML models: data prep, performance measurement</li><li>${td("model, dataset, metric reached")}</li></ul></div>
<div class="it"><small>AUG 2026 · 1 month · Virtual</small><h3>Python Coding Externship<span class="tag">EXTERNSHIP</span></h3><div class="pk">@ Deloitte Australia (Forage)</div><ul><li>One-month Technology job simulation focused on Python coding</li></ul></div>
<div class="it"><small>JUL — AUG 2026 · 2 months · Virtual</small><h3>Prompt &amp; Contextual Engineering<span class="tag">EXTERNSHIP</span></h3><div class="pk">@ Vista Equity Partners (Forage)</div><ul><li>Two-month AI in Action externship covering prompt engineering and contextual engineering</li></ul></div>
<div class="it"><small>APR — MAY 2025 · Remote</small><h3>Marketing Automation Intern</h3><div class="pk">@ TheMediaHub</div><ul><li>Researched newsletter collaboration partners across Reddit communities</li><li>Used AI tools for research, then wrote personalized outreach</li><li>${td("shortlisted, sent, replies")}</li></ul></div></div>
<div class="code" style="margin-top:34px"><b>achievements.log</b><div class="log"><div><span>[DONE]</span> <em>OK</em> Deloitte Australia: Python coding externship</div><div><span>[DONE]</span> <em>OK</em> Vista Equity Partners: Prompt &amp; contextual engineering</div><div><span>[NOW]</span> <em>OK</em> AI Automation Intern, DevelopersHub</div></div></div></div>`,
contact:()=>`<div class="ct"><div><h2>Contact</h2><h4 class="big">Let’s build something <em>that runs itself.</em></h4><div class="ls">
<a href="mailto:${EMAIL}"><span>email</span>${EMAIL}<i>↗</i></a>
<a href="tel:${PHONE}"><span>phone</span>(+92) 0328 4106283<i>↗</i></a>
<a href="https://wa.me/${PHONE.slice(1)}" target="_blank" rel="noopener"><span>whatsapp</span>chat on WhatsApp<i>↗</i></a>
<a href="https://behance.net/zoyaqaiser" target="_blank" rel="noopener"><span>behance</span>behance.net/zoyaqaiser<i>↗</i></a>
<a href="https://zoyaqaiser.github.io/portfolio/" target="_blank" rel="noopener"><span>portfolio</span>zoyaqaiser.github.io/portfolio<i>↗</i></a></div></div>
<div class="fm"><p class="cm" style="margin:0">// SEND A MESSAGE</p><label for="cn">name</label><input class="in" id="cn" placeholder="Your name"><label for="ce">email</label><input class="in" id="ce" placeholder="you@domain.com"><label for="cm">message</label><textarea class="in" id="cm" placeholder="What are we building?"></textarea><button class="btn p" data-act="send">▸ send --message</button></div></div>`
};
function S_(){return[["Ayesha Khan","Website form","Hi Zoya, I run a small bakery in Lahore and need an automation that sends new orders from our website to a Google Sheet and replies to customers. Budget is around PKR 40,000. Email me at ayesha@sweetcrumbs.pk","Bakery order bot"],["Daniel Ross","Email","Hello, I edit a weekly design newsletter and would love a collaboration or cross-promo partnership. Reach me at daniel@designweekly.com","Newsletter collab"],["Bilal","WhatsApp","your n8n workflow is not working, getting an error and I need help urgently","Urgent support"],["Promo Bot","Email","Guaranteed rank #1 with cheap backlinks and free money crypto casino. Click here now!","Spam"]]}
const S=S_();let hist=[],last=null,busy=false,tim;
function analyze(name,src,msg,o){const m=msg.toLowerCase(),email=(msg.match(/[\w.+-]+@[\w-]+\.[\w.]+/)||[])[0]||"",phone=(msg.match(/\+?\d[\d\s-]{8,}\d/)||[])[0]||"",bud=(msg.match(/(?:\$|rs\.?|pkr|usd)\s?[\d,.]+k?/i)||[])[0]||"";
 const kw={Spam:["crypto","casino","click here","free money","backlink","guaranteed rank"],Support:["issue","problem","error","not working","refund","broken","urgent"],Partnership:["collab","partnership","newsletter","cross-promo","sponsor"],Sales:["quote","price","hire","project","website","automation","seo","build","budget","need"]};
 let cat="General",best=0;for(const k in kw){const h=kw[k].filter(w=>m.includes(w)).length;if(h>best){best=h;cat=k}}
 const urgent=/urgent|asap|immediately|today/.test(m),neg=/not working|error|broken|angry|refund|problem/.test(m),sent=neg?"Negative":cat==="Spam"?"n/a":"Neutral/positive";
 let pr=cat==="Sales"?55+best*7+(bud?15:0)+(email?10:0):cat==="Spam"?2:cat==="Support"?60+(urgent?25:0):cat==="Partnership"?45+(email?15:0):30;pr=Math.min(99,pr);
 const f=name.split(" ")[0]||"there",fr=o.tone==="Friendly";let route,reply;
 const hi=fr?`Hi ${f},`:`Dear ${f},`;
 if(cat==="Spam"&&o.spam){route="Blocked";reply="(no reply sent)"}
 else if(!email&&!phone&&src!=="WhatsApp"){route="Ask for contact info";reply=`${hi} thank you for reaching out. Could you share the best email to continue?`}
 else if(pr>=75){route="Notify Zoya now";reply=`${hi} thank you for your message. This is the kind of workflow I enjoy building. Could we have a short call this week to scope it${bud?` around your ${bud} budget`:""}?`}
 else{route="Auto-reply + sheet";reply=cat==="Support"?`${hi} sorry about the trouble. I have logged this. Could you send a screenshot or the error text?`:cat==="Partnership"?`${hi} thanks for the idea! What audience size and topics do you cover?`:`${hi} thanks for getting in touch! Tell me more about what you’d like to automate.`}
 if(!o.reply&&route!=="Blocked")reply="(auto-reply off, drafted only)\n"+reply;
 const sla=pr>=75?"15 min":pr>=45?"4 hours":"24 hours";
 return{name,src,cat,pr,email:email||"none",phone:phone||"none",bud:bud||"none",urgent,sent,sla,route,reply}}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){if(busy)return;const name=$("wn").value.trim()||"Unknown",msg=$("wm").value.trim();if(!msg)return say("Add a message first");busy=true;
 const o={tone:$("wt").value,spam:$("fs").checked,reply:$("fa").checked};
 const r=analyze(name,$("ws").value,msg,o);r.t=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"});
 const out=[`${r.src}, ${msg.length} chars`,`email ${r.email==="none"?"–":"✓"} · phone ${r.phone==="none"?"–":"✓"} · budget ${r.bud==="none"?"–":"✓"}`,`${r.cat}, score ${r.pr}`,r.route,r.route==="Blocked"?"nothing sent":"reply + row logged"];
 const ns=[...document.querySelectorAll(".nd")];ns.forEach(n=>{n.className="nd";n.querySelector("em").textContent=""});$("res").innerHTML="";$("pg2").style.width="0";
 for(let i=0;i<ns.length;i++){ns[i].classList.add("on");await sleep(380);ns[i].className="nd dn";ns[i].querySelector("em").textContent=out[i];if(r.route==="Blocked"&&i===3)ns[i].classList.add("bk");$("pg2").style.width=(i+1)*20+"%"}
 hist.unshift(r);last=r;showRes();hist_();busy=false}
function payload(r){return JSON.stringify({received_at:r.t,lead:{name:r.name,source:r.src,email:r.email,phone:r.phone,budget:r.bud},ai:{category:r.cat,score:r.pr,sentiment:r.sent,urgent:r.urgent},action:{route:r.route,sla:r.sla}},null,2)}
function showRes(){const r=last;if(!r)return;
 $("res").innerHTML=`<div style="margin-top:14px;color:var(--mut);font-size:12px">Lead score ${r.pr}/100</div><div class="gauge"><i id="gg"></i></div><div class="kv"><div><span>Category</span>${r.cat}</div><div><span>Sentiment</span>${r.sent}</div><div><span>Urgent</span>${r.urgent?"Yes":"No"}</div><div><span>Reply SLA</span>${r.sla}</div><div><span>Email</span>${esc(r.email)}</div><div><span>Phone</span>${esc(r.phone)}</div><div><span>Budget</span>${esc(r.bud)}</div><div><span>Route</span>${r.route}</div></div>
 <div class="tabs"><button class="on" data-tab="reply">Drafted reply</button><button data-tab="row">Sheet row</button><button data-tab="json">Webhook JSON</button></div><pre id="tp"></pre><button class="btn sm" data-act="copyt">Copy</button>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{const g=$("gg");if(g)g.style.width=r.pr+"%"}));tab("reply")}
function tab(t){const r=last;if(!r)return;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));$("tp").dataset.t=t;$("tp").textContent=t==="reply"?r.reply:t==="row"?[r.t,r.name,r.src,r.cat,r.pr,r.email,r.phone,r.bud,r.route].join(" | "):payload(r)}
function hist_(){const b=$("hist");if(!b)return;b.innerHTML=hist.length?hist.map(r=>`<tr><td>${r.t}</td><td>${esc(r.name)}</td><td>${r.src}</td><td>${r.cat}</td><td><span class="badge ${r.pr>=75?"b-hot":r.pr>=30?"b-ok":"b-no"}">${r.pr}</span></td><td>${r.route}</td></tr>`).join(""):`<tr><td colspan="6" style="color:var(--mut)">No runs yet.</td></tr>`;
 const n=hist.length,h=hist.filter(r=>r.pr>=75).length,bl=hist.filter(r=>r.route==="Blocked").length,av=n?Math.round(hist.reduce((a,r)=>a+r.pr,0)/n):0;
 $("kp").innerHTML=`<div><b>${n}</b><span>Leads processed</span></div><div><b>${h}</b><span>Hot leads</span></div><div><b>${av}</b><span>Avg score</span></div><div><b>${bl}</b><span>Spam blocked</span></div><div><b>${n?Math.round((n-bl)/n*100):0}%</b><span>Auto-handled</span></div>`}
function fill(i){const s=S[i];$("wn").value=s[0];$("ws").value=s[1];$("wm").value=s[2];document.querySelectorAll("#chs button").forEach((b,k)=>b.classList.toggle("on",k===i))}
function say(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(say.t);say.t=setTimeout(()=>e.classList.remove("show"),1800)}
const cp=(t,m)=>navigator.clipboard.writeText(t).then(()=>say(m||"Copied"),()=>say("Copy blocked"));
const A={run,
 async all(){for(let i=0;i<S.length;i++){fill(i);await run();await sleep(250)}},
 clear(){hist=[];last=null;hist_();$("res").innerHTML='<p style="color:var(--mut);margin-top:14px">Results appear here after you run it.</p>'},
 copyt(){cp($("tp").textContent)},
 csv(){if(!hist.length)return say("Run the workflow first");cp("time,name,source,category,score,email,phone,budget,route\n"+hist.map(r=>[r.t,r.name,r.src,r.cat,r.pr,r.email,r.phone,r.bud,r.route].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n"))},
 send(){const n=$("cn").value,e=$("ce").value,m=$("cm").value;if(!m.trim())return say("Write a message first");location.href=`mailto:${EMAIL}?subject=${encodeURIComponent("Portfolio message from "+(n||"visitor"))}&body=${encodeURIComponent(m+"\n\n"+n+" "+e)}`}};
function render(){let n=location.hash.slice(1);if(!T.includes(n))n="home";clearInterval(tim);busy=false;
 $("nav").innerHTML=T.map((t,i)=>`<button data-go="${t}" class="${t===n?"on":""}"><span>0${i+1}</span>${t}</button>`).join("");
 $("pt").textContent=`zoya@portfolio:~/${n}$`;$("pg").innerHTML=P[n]();$("pg").scrollTop=0;document.title="Zoya Qaiser | "+n;
 $("pg").querySelectorAll(".lead,.btns,.cm,.row,.it,.sc,.foc div,.ls a,.fm,.panel,.kp div,.code,.br").forEach((el,i)=>{el.classList.add("rv");el.style.animationDelay=Math.min(i*60,700)+"ms"});
 if(n==="home"){const w="Automation workflows that run themselves",e=$("ty");let i=0;if(matchMedia("(prefers-reduced-motion:reduce)").matches)e.textContent=w;else tim=setInterval(()=>{e.textContent=w.slice(0,++i);if(i>=w.length)clearInterval(tim)},55)}
 if(n==="workflow"){fill(0);hist_()}}
function pal(){$("ov").hidden=false;$("q").value="";ql();$("q").focus()}
function ql(){const q=$("q").value.toLowerCase();$("ql").innerHTML=T.filter(t=>t.includes(q)).map(t=>`<button data-go="${t}">${t}</button>`).join("")}
document.addEventListener("click",e=>{const t=e.target,a=t.closest("[data-act]");if(a&&A[a.dataset.act])return A[a.dataset.act]();if(t.id==="ov"){$("ov").hidden=true;return}
 const sp=t.closest("[data-samp]");if(sp)return fill(+sp.dataset.samp);const tb=t.closest("[data-tab]");if(tb)return tab(tb.dataset.tab);
 const g=t.closest("[data-go]");if(g){$("ov").hidden=true;if(location.hash==="#"+g.dataset.go)render();else location.hash=g.dataset.go}});
document.addEventListener("input",e=>{if(e.target.id==="q")ql()});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal()}else if(e.key==="Escape")$("ov").hidden=true;else if(e.key==="Enter"&&e.target.id==="q"){const b=document.querySelector("#ql [data-go]");if(b)b.click()}});
addEventListener("hashchange",render);render();
</script>
